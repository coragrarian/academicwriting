name: Publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.6'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Validate canonical sources
        run: uv run --frozen agrarian validate
      - name: Check Python
        run: uv run --frozen ruff check . --no-cache
      - name: Check JavaScript syntax
        run: |
          node --check static/exercises.js
          node --check static/navigation.js
          node --check static/progress.js
          node --check static/home.js
      - name: Run ordinary tests
        run: uv run --frozen pytest -q
      - name: Install Chromium and browser dependencies
        run: uv run --frozen playwright install --with-deps chromium
      - name: Run full browser suite
        run: uv run --frozen pytest -m browser -q
      - uses: actions/configure-pages@v6
      - name: Build static site
        run: uv run --frozen agrarian build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v5
