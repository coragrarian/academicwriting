name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.6'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check Python
        run: uv run --frozen ruff check . --no-cache
      - name: Check JavaScript syntax
        run: |
          node --check static/exercises.js
          node --check static/navigation.js
      - name: Build site
        run: uv run --frozen python build.py
      - name: Run ordinary tests
        run: uv run --frozen pytest -q
      - name: Install Chromium and browser dependencies
        run: uv run --frozen playwright install --with-deps chromium
      - name: Run full browser suite
        run: uv run --frozen pytest -m browser -q
