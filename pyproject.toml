[project]
name = "agrarian-writing-builder"
version = "0.2.0a1"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=4,<5",
    "Jinja2>=3.1,<4",
    "pyyaml>=6,<7",
]

[project.scripts]
agrarian = "agrarian_builder.cli:main"

[build-system]
requires = ["uv_build==0.12.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agrarian_builder"
module-root = ""

[dependency-groups]
dev = [
    "playwright>=1.55,<2",
    "pytest>=9,<10",
    "ruff>=0.16.5,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not browser'"
markers = [
    "browser: real Chromium interaction and navigation checks",
    "canonical: regressions that depend on the approved production course or public copy",
]
